<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

<h1>Form Validation</h1>

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name">

    <br><br>

    <button type="submit">Submit</button>

</form>

{% if message %}
<p>{{ message }}</p>
{% endif %}

</body>
</html>
